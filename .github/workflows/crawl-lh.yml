name: Crawl LH rental notices

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  pull_request:

concurrency:
  group: crawl-lh-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Test LH crawler parsers
        run: python scripts/test_crawl_lh.py

  crawl:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Fetch new LH 매입임대 housing lists
        run: python scripts/crawl_lh.py --lookback-days 90 --max-new 20

      - name: Commit data if changed
        run: |
          git add source scripts/lh-crawl-state.json web/data
          if git diff --staged --quiet; then
            echo "No new LH notices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add latest LH 매입임대 housing lists."
          git push
